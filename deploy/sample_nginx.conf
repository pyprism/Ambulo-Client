# Ambulo Flutter web client. Replace the domain, certificate paths, and root
# before enabling this site. The app's API server is configured by the user at
# runtime, so this virtual host serves only static client files.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain;

    root /path-to/Ambulo-Client;
    index index.html;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/your-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/your-domain/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Web SQLite/Drift uses a worker and WASM. Keep these headers on every
    # response, including the SPA fallback.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    # Ambulo is self-hosted: users may configure any HTTP(S) server address.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http: https:; img-src 'self' data: blob: http: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline'; worker-src 'self' blob:" always;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Flutter loader files change on each release; never cache them.
    location ~ ^/(flutter_bootstrap\.js|flutter\.js|main\.dart\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(?:wasm|js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # SPA deep links and Drift worker/static files.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    access_log /var/log/nginx/your-domain_access.log combined;
    error_log /var/log/nginx/your-domain_error.log warn;
}
