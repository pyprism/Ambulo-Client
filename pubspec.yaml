name: ambulo
description: "Ambulo — privacy-first, self-hostable location tracker and fitness dashboard."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  drift: ^2.34.2
  path_provider: ^2.1.6
  path: ^1.9.1
  dio: ^5.10.0
  flutter_secure_storage: ^10.3.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  fl_chart: ^1.2.0
  google_fonts: ^8.2.0
  intl: ^0.20.3
  uuid: ^4.6.0
  connectivity_plus: ^7.3.0
  shared_preferences: ^2.5.5
  go_router: ^17.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  drift_flutter: ^0.3.1
  geolocator: ^14.0.3
  battery_plus: ^7.1.1
  pedometer: ^4.2.0
  sensors_plus: ^7.1.0
  share_plus: ^13.2.1
  csv: ^8.0.0
  file_picker: 12.0.0-beta.7
  xml: ^7.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  riverpod_generator: ^4.0.4
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 23
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#272822"
    theme_color: "#272822"
