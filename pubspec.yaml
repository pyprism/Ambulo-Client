name: ambulo
description: "Ambulo — privacy-first, self-hostable location tracker and fitness app."
publish_to: 'none'

version: 1.0.4+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  drift: ^2.34.3
  path_provider: ^2.1.6
  path: ^1.9.1
  dio: ^5.10.0
  flutter_secure_storage: ^11.0.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  fl_chart: ^1.2.0
  google_fonts: ^8.2.0
  intl: ^0.20.3
  uuid: ^4.6.0
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.5.5
  go_router: ^17.5.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  drift_flutter: ^0.3.1
  geolocator: ^14.0.3
  battery_plus: ^7.1.1
  pedometer: ^4.2.0
  permission_handler: ^12.0.3
  sensors_plus: ^7.1.0
  share_plus: ^13.3.0
  csv: ^8.0.0
  file_picker: 12.0.0-beta.7
  xml: ^7.0.1
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.1
  health: ^13.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  riverpod_generator: ^4.0.4
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.1
  flutter_launcher_icons: ^0.14.4
  geolocator_platform_interface: ^4.2.8
  plugin_platform_interface: ^2.1.8
  sqlite3: ^3.5.1

# health pins device_info_plus to ^12.1.0 (win32 ^5.11.0), but file_picker
# needs win32 ^6.3.0 — incompatible ranges. device_info_plus 13.x moved to
# win32 ^6.x itself (and only through its Windows desktop code path, which
# this project never compiles — no windows/ target, see CLAUDE.md), so
# overriding it resolves the conflict without touching win32 directly.
dependency_overrides:
  device_info_plus: ^13.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 23
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#272822"
    theme_color: "#272822"
